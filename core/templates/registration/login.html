{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aryal Agro ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
    <link rel="icon" type="image/png" href="{% static 'core/images/favicon.png' %}">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-dark);
            margin: 0;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .brand-logo {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="brand-logo">
            <span>🌱</span> Aryal Agro ERP
        </div>

        <h2 style="text-align: center; margin-bottom: 1.5rem;">Login</h2>

        <form method="post">
            {% csrf_token %}

            {% if form.errors %}
            <div
                style="background-color: rgba(239, 68, 68, 0.1); color: var(--danger); padding: 1rem; border-radius: 0.5rem; margin-bottom: 1rem; border: 1px solid var(--danger);">
                <p style="margin: 0;">Invalid username or password.</p>
            </div>
            {% endif %}

            <div style="margin-bottom: 1rem;">
                <label for="id_username"
                    style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Username</label>
                <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username"
                    maxlength="150" required id="id_username" class="form-control">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label for="id_password"
                    style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Password</label>
                <input type="password" name="password" autocomplete="current-password" required id="id_password"
                    class="form-control">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Sign In</button>

            <input type="hidden" name="next" value="{{ next }}">
        </form>
    </div>
</body>

</html>
